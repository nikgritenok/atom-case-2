apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Postgres
    type: postgres
    access: proxy
    url: db:5432
    database: maintenance
    user: app
    secureJsonData:
      password: app
    jsonData:
      sslmode: disable
      maxOpenConns: 5
