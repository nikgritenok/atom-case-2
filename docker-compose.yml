services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-maintenance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-maintenance}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
    ports:
      - '3000:3000'

volumes:
  pgdata:
